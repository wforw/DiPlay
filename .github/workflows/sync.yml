name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    permissions:
      contents: write

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Pull upstream changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加上游仓库并拉取
        git remote add upstream https://github.com/shihabal3amri/DiPlay.git
        git fetch upstream
        
        # 尝试合并上游的 main 分支
        git merge upstream/main --allow-unrelated-histories -m "Auto-sync with upstream" || true
        
        # 核心：恢复本地的 workflow 文件，避免触发权限拒绝错误
        git checkout HEAD -- .github/workflows/ || true
        git reset .github/workflows/ || true
        
        # 推送更新到自己的仓库
        git push origin main
