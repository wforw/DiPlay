name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repo

    steps:
    - name: Checkout target repo
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.SYNC_TOKEN }} # 使用具有 workflow 权限的 PAT Token
        fetch-depth: 0

    - name: Pull and Sync upstream changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 添加上游仓库并拉取最新提交
        git remote add upstream https://github.com/shihabal3amri/DiPlay.git
        git fetch upstream
        
        # 合并上游 main 分支（包括 workflow 文件的变动）
        git merge upstream/main --allow-unrelated-histories -m "Auto-sync with upstream" || true
        
        # 推送所有变更（包括 workflow）
        git push origin main
